  <div id="container"></div>
  <script type="module">

    import * as ReactDOM from '../../../packages/react-dom/index.js'

    function App() {
      const [count, setCount] = React.useState(0)

      function handle() {
        setCount(count + 1)
      }

      return <div>
        <button onClick={handle}>increase</button>
        {count}
      </div>
    }

    const root = ReactDOM.createRoot(document.getElementById("container"));
    debugger

    root.render(
      <>
        <h1>Hello World!</h1>
        <h1>Hello World!</h1>
        <App />
      </>
    );
  </script>
